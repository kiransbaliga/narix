<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://baliga.dev/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to baliga.dev...</title>
  <script>
    window.location.replace("https://baliga.dev" + window.location.pathname + window.location.search + window.location.hash);
  </script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121212;
      color: #e0e0e0;
      text-align: center;
    }
    @media (prefers-color-scheme: light) {
      body {
        background-color: #f7f7f7;
        color: #222222;
      }
    }
    .container {
      max-width: 540px;
      padding: 2rem;
      border-radius: 8px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    p {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      opacity: 0.9;
    }
    a {
      color: #3b82f6;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Page Moved</h1>
    <p>This blog has moved to <a href="https://baliga.dev/">baliga.dev</a>.</p>
    <p>Redirecting you now... If you are not redirected automatically, please <a id="redirect-link" href="https://baliga.dev/">click here to visit baliga.dev</a>.</p>
  </div>
  <script>
    try {
      const destination = "https://baliga.dev" + window.location.pathname + window.location.search + window.location.hash;
      const link = document.getElementById("redirect-link");
      if (link) {
        link.href = destination;
      }
    } catch {}
  </script>
</body>
</html>
